<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070F" />
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="45%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded tile -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" stroke="#374151" stroke-width="4"/>
  <!-- Subtle inner radial glow -->
  <circle cx="64" cy="64" r="42" fill="#7C3AED" opacity="0.2"/>
  <!-- Bold Capital Letter F -->
  <text x="64" y="69" text-anchor="middle" dominant-baseline="central" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-weight="900" font-size="84" fill="url(#fGrad)" filter="url(#fShadow)">F</text>
</svg>
